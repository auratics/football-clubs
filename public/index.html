<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e6">
  <title>Most Irritating Club: Which football club irritates you the most this month?</title>
  <meta name="description" content="Vote for the football club that irritates you the most. Monthly and all-time rankings of the most irritating clubs in the world, by country and by league.">
  <meta property="og:title" content="Most Irritating Club">
  <meta property="og:description" content="Which football club irritates you the most this month? Vote and see the rankings.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Most Irritating Club">
  <!-- Önizleme görseli: sunucuda kendi alan adınla tam adres yaz, ör. https://alanadin.com/og.png -->
  <meta property="og:image" content="og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/anton-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!--
    GOOGLE ADSENSE: Onay aldıktan sonra AdSense'in verdiği <script> satırını buraya yapıştırın.
    Ör: <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXX" crossorigin="anonymous"></script>
  -->
</head>
<body>
  <div class="page">
    <header>
      <div class="strap"><span id="edition">&nbsp;</span><span>Tables reset on the 1st</span></div>
      <h1><a href="./" class="logo">Most Irritating Club</a></h1>
      <div class="rule"></div>
      <div class="search">
        <input id="search" type="search" placeholder="Look up any club…" autocomplete="off" aria-label="Search clubs">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
    </header>

    <main>
      <section class="lead" id="leaders" aria-label="Most irritating clubs"></section>

      <div class="front">
        <section class="coupon" id="vote">
          <h2>Which club irritates you the most?</h2>
          <p class="tag">One vote per league, every week.</p>
          <div class="pickers">
            <label>Country
              <select id="country"></select>
            </label>
            <label>League
              <select id="league"></select>
            </label>
            <label class="wide"><span id="clubFlag"></span> Club
              <select id="club"></select>
            </label>
          </div>
          <div id="voteNotice" class="notice" hidden></div>
          <button id="voteBtn" class="btn" disabled>Pick a club first</button>
          <p id="voteError" class="error" hidden></p>
        </section>

        <div class="tables" id="tables">
          <div class="table-filter">
            <label>Period
              <select id="period"></select>
            </label>
            <label>Country
              <select id="tableCountry"></select>
            </label>
            <label>League
              <select id="tableLeague"></select>
            </label>
          </div>
          <section>
            <h2 class="section-h" id="tableTitle">This month's table</h2>
            <p id="tableMeta" class="meta"></p>
            <ol id="tableList" class="rank-list"></ol>
            <div class="table-actions">
              <button id="moreBtn" class="link" hidden>Show more</button>
              <button id="tableShare" class="link" hidden>Share this table</button>
            </div>
          </section>
        </div>
      </div>


      <section class="card" id="movers">
        <h2 class="section-h">On the move</h2>
        <div class="tabs">
          <button class="tab active" data-mv="risers">Rising vs last month</button>
          <button class="tab" data-mv="fallers">Falling</button>
          <button class="tab" data-mv="trending">Hot this week</button>
        </div>
        <ol id="moversList" class="rank-list"></ol>
      </section>


    </main>

    <footer>
      <p>Just for fun. Rankings are based on anonymous visitor votes, not facts.</p>
      <p><a href="privacy.html">Privacy &amp; cookies</a></p>
    </footer>
  </div>

  <!-- Kulüp penceresi -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Details">
      <button class="close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
